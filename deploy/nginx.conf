# 不记录路径、查询参数、请求体、令牌、电话号码或客户端地址。
log_format limited '$request_method $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log limited;
error_log /var/log/nginx/error.log crit;
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;
# 使用连接来源而非客户端可伪造的转发头；认证按平均速率排队消化突发。
limit_req_zone $binary_remote_addr zone=auth_remote:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_remote:10m rate=120r/m;

server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}

# 仅容器回环接口可访问，检测静态首页与 API。
server {
  listen 127.0.0.1:8080;
  set $api http://api:4310;
  root /usr/share/nginx/html;
  location = /healthz {
    if (!-f $document_root/index.html) { return 503; }
    proxy_pass $api/api/health;
  }
}

server {
  listen 443 ssl;
  set $api http://api:4310;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;
  limit_req zone=general_remote burst=20 nodelay;
  limit_req_status 429;
  error_page 429 = @rate_limited;
  location @rate_limited {
    default_type application/json;
    charset utf-8;
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试。"}}';
  }
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  # 保留路径前缀；禁止失败后重发写请求。
  proxy_next_upstream off;
  # 子级配置不会继承父级限流，因此同时明确应用普通限流与认证限流。
  location = /api/auth {
    limit_req zone=general_remote burst=20 nodelay;
    limit_req zone=auth_remote burst=5;
    proxy_pass $api;
  }
  location ^~ /api/auth/ {
    limit_req zone=general_remote burst=20 nodelay;
    limit_req zone=auth_remote burst=5;
    proxy_pass $api;
  }
  location = /api/admin/pairing {
    limit_req zone=general_remote burst=20 nodelay;
    limit_req zone=auth_remote burst=5;
    proxy_pass $api;
  }
  location = /api { proxy_pass $api; }
  location ^~ /api/ { proxy_pass $api; }
  location = /uploads { proxy_pass $api; }
  location ^~ /uploads/ { proxy_pass $api; }
  location ^~ /assets/ { try_files $uri =404; }
  location ~ /\. { deny all; }
  location / { try_files $uri $uri/ /index.html; }
}
